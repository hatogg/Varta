# Збирає APK, проганяє тести й викладає APK у реліз «v<versionName>» (кожен push у main оновлює файл у релізі).
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        id: build
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --console=plain 2>&1 | tee build.log
      - name: Unit test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          rows = []
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              r = ET.parse(f).getroot()
              t, fl, er, sk = (int(r.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
              rows.append(f"{r.get('name').split('.')[-1]}: {t - fl - er - sk} passed, {fl + er} failed, {sk} skipped")
          print("::notice title=unit tests::" + ("%0A".join(rows) or "no results"))
          PY
      - name: Why it failed
        if: failure() && steps.build.outcome == 'failure'
        run: python3 .github/annotate.py build.log
      - name: Keep the full log in the ci-log branch
        if: failure() && steps.build.outcome == 'failure' && github.event_name != 'pull_request'
        run: |
          mkdir /tmp/log && cp build.log /tmp/log/ && cp -r app/build/test-results /tmp/log/ 2>/dev/null || true
          cd /tmp/log
          git init -q -b ci-log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "build log for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log
      - name: Name the file
        id: v
        run: |
          v="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          echo "name=$v" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "Varta-$v.apk"
          ls -la Varta-*.apk
      - name: No internet, no ads
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$aapt2" dump permissions "Varta-${{ steps.v.outputs.name }}.apk" | tee perms.txt
          # «Варта» нічого не надсилає: дозволу на інтернет і рекламного ідентифікатора бути не може
          if grep -E "permission: android.permission.INTERNET|AD_ID" perms.txt; then
            echo "::error title=privacy::The APK requests internet or advertising ID"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: Varta-apk
          path: Varta-*.apk
      - name: Publish to the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.name }}
        run: |
          tag="v$V"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "Varta-$V.apk" --clobber
          else
            cat > notes.md <<'NOTES'
          **Як встановити:** завантажте `.apk` нижче на телефоні, відкрийте його й дозвольте встановлення з цього джерела. Нові версії ставляться поверх старої.

          Перевірка телефона на шпигунські програми й бекдори (база Echap: відомі стежилки за назвою пакета, сертифікатом і хешем), підозрілі права й налаштування, і очищення пам'яті від сміття. Без інтернету й реклами.
          NOTES
            gh release create "$tag" "Varta-$V.apk" --target "$GITHUB_SHA" --title "Варта $V" --notes-file notes.md
          fi
